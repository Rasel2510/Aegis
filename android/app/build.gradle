plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace "com.aegis.app"
    compileSdk 36
    ndkVersion "27.2.12479018"

    compileOptions {
        coreLibraryDesugaringEnabled true
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    defaultConfig {
        applicationId "com.aegis.app"
        minSdkVersion flutter.minSdkVersion
        targetSdk 36
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        release {
            def keystorePath = System.getenv("AEGIS_KEYSTORE_PATH") ?:
                               (project.hasProperty("aegis.keystore") ?
                                project.property("aegis.keystore") : null)
            if (keystorePath) {
                storeFile     file(keystorePath)
                storePassword System.getenv("AEGIS_KEYSTORE_PASS") ?: project.findProperty("aegis.storePassword") ?: ""
                keyAlias      System.getenv("AEGIS_KEY_ALIAS")     ?: project.findProperty("aegis.keyAlias")      ?: "aegis"
                keyPassword   System.getenv("AEGIS_KEY_PASS")      ?: project.findProperty("aegis.keyPassword")   ?: ""
            }
        }
    }

    buildTypes {
        debug {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled true
            shrinkResources true
            signingConfig signingConfigs.release
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'),
                          'proguard-rules.pro'
        }
    }
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'

    implementation "org.bouncycastle:bcpkix-jdk18on:1.78.1"
    implementation "org.bouncycastle:bcprov-jdk18on:1.78.1"
}

flutter {
    source '../..'
}