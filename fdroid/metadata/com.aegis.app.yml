AutoName: Aegis
Summary: System-wide ad blocker — no root, no remote servers
Description: |-
  Aegis blocks ads system-wide on Android using a local VPN and DNS server.
  No data leaves your device. No accounts. No subscriptions.

  **How it works:** Aegis runs a local DNS server. The VPN tells Android to
  send all DNS queries there. Blocked domains (ads, trackers) return "not found"
  before they can load in any app.

  **Features:**
  * Blocks ads in all apps including browsers
  * 100k+ domain blocklist, auto-updated every 24 hours
  * Real-time query log — see every DNS request live
  * DNS-over-HTTPS support (Cloudflare, Google, AdGuard, custom)
  * Custom block and allow rules
  * Per-app exclusions for banking apps
  * Statistics dashboard — 30-day history
  * Optional HTTPS filtering (requires CA certificate install)
  * Boot auto-start, dark mode

  **No root required.**

